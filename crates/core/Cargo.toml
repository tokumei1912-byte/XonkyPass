[package]
name = "xonkypass-core"
description = "Ядро XonkyPass: шифрование, хранилище, поиск"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Argon2id; `parallel` считает полосы (p) в несколько потоков: за то же время
# разблокировки получается больше работы для перебора.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "parallel", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
zeroize = { version = "1.9.2", features = ["derive"] }
zxcvbn = "3.1.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
